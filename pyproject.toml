[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accnt-management-suite"
version = "1.0.0"
description = "BNet + Twitch Account Management Suite"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.2",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "httpx[socks]>=0.27.2",
    "cryptography>=43.0.1",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20.0",
    "websockets>=13.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.8",
    "mypy>=1.11.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
